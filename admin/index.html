<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Content Manager - Cronache di Krynn</title>
  </head>
  <body>
    <!-- Include Decap CMS senza autoinizializzazione per consentire la configurazione manuale -->
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
    <script>
      window.CMS.init({
        config: {
          backend: {
            name: 'github',
            repo: 'IL_TUO_USERNAME/cronache-di-krynn',
            branch: 'master'
          }
        }
      });
    </script>
  </body>
</html>
